name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: build, manifest, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Committed lib/ is in sync with src/
        run: git diff --exit-code -- lib

      - name: Manifest conformance
        run: npm run validate:manifest

      - name: Suites
        run: node test/run.mjs

      - name: Typecheck
        run: npm run typecheck
